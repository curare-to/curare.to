##
## relay.curare.to — strfry configuration
##
## Everything not set here is strfry's default. The write policy is the one
## thing that makes this relay this relay: see policy.mjs.
##

db = "/app/strfry-db/"

dbParams {
    maxreaders = 256
    mapsize = 10995116277760
    noReadAhead = false
}

events {
    # The policy caps content; this is the hard ceiling on an event's JSON.
    maxEventSize = 65536
    rejectEventsNewerThanSeconds = 900
    rejectEventsOlderThanSeconds = 94608000
    rejectEphemeralEventsOlderThanSeconds = 60
    ephemeralEventsLifetimeSeconds = 300
    maxNumTags = 2000
    maxTagValSize = 1024
}

relay {
    bind = "0.0.0.0"
    port = 7777
    nofiles = 1000000
    realIpHeader = "X-Forwarded-For"

    info {
        name = "relay.curare.to"
        description = "Curated lists: schemas, suggestions and canonical entries, with the comments, votes, reports and labels that attach to them. Synced from the relays the lists name."
        pubkey = ""
        contact = ""
        # NIP-45 counts are advertised because strfry supports COUNT, and the site uses them for comment counts.
        nips = [1, 9, 11, 22, 25, 32, 40, 45, 51, 56, 70, 77]
    }

    maxWebsocketPayloadSize = 131072
    autoPingSeconds = 55
    enableTcpKeepalive = false
    queryTimesliceBudgetMicroseconds = 10000
    maxFilterLimit = 500
    maxSubsPerConnection = 20

    writePolicy {
        plugin = "/app/policy.mjs"
    }

    compression {
        enabled = true
        slidingWindow = true
    }

    logging {
        dumpInAll = false
        dumpInEvents = false
        dumpInReqs = false
        dbScanPerf = false
        invalidEvents = true
    }

    numThreads {
        ingester = 3
        reqWorker = 3
        reqMonitor = 3
        negentropy = 2
    }

    negentropy {
        enabled = true
        maxSyncEvents = 1000000
    }
}
